<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="auto" style="background-color: #0f172a; border-radius: 8px; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Title Section -->
  <rect x="20" y="20" width="860" height="440" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="50" y="60" fill="#38bdf8" font-size="20" font-weight="bold">Triple-Output Linear Power Supply (7805 / 7812 / 7912)</text>
  <text x="50" y="85" fill="#94a3b8" font-size="13">Ferric Chloride (FeCl3) Chemical Etched PCB &amp; Bench Test Verification Architecture</text>

  <!-- Stage 1: Input -->
  <g transform="translate(50, 120)">
    <rect width="130" height="90" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)" />
    <text x="65" y="35" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">AC / DC Input</text>
    <text x="65" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">15V-0-15V AC</text>
    <text x="65" y="72" fill="#64748b" font-size="10" text-anchor="middle">Center-Tapped</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 180 165 L 210 165" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" />
  <polygon points="210,165 204,161 204,169" fill="#38bdf8" />

  <!-- Stage 2: Rectification -->
  <g transform="translate(210, 120)">
    <rect width="140" height="90" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
    <text x="70" y="35" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Full-Wave Bridge</text>
    <text x="70" y="55" fill="#38bdf8" font-size="11" text-anchor="middle">4x Diodes (1N4007)</text>
    <text x="70" y="72" fill="#94a3b8" font-size="10" text-anchor="middle">Dual Rail Rectification</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="380,165 374,161 374,169" fill="#38bdf8" />
  <path d="M 350 165 L 380 165" stroke="#38bdf8" stroke-width="2" />

  <!-- Stage 3: Filtering -->
  <g transform="translate(380, 120)">
    <rect width="140" height="90" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5" filter="url(#shadow)" />
    <text x="70" y="35" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">Filter Capacitors</text>
    <text x="70" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">Bulk Electrolytic</text>
    <text x="70" y="72" fill="#64748b" font-size="10" text-anchor="middle">1000uF - 4700uF</text>
  </g>

  <!-- Split Wires to Regulators -->
  <path d="M 520 165 L 560 165" stroke="#38bdf8" stroke-width="2" />
  <path d="M 560 165 L 560 135 L 590 135" stroke="#38bdf8" stroke-width="2" />
  <polygon points="590,135 584,131 584,139" fill="#38bdf8" />
  <path d="M 560 165 L 590 165" stroke="#38bdf8" stroke-width="2" />
  <polygon points="590,165 584,161 584,169" fill="#38bdf8" />
  <path d="M 560 165 L 560 205 L 590 205" stroke="#38bdf8" stroke-width="2" />
  <polygon points="590,205 584,201 584,209" fill="#38bdf8" />

  <!-- Stage 4: Regulators -->
  <g transform="translate(590, 110)">
    <!-- 7805 -->
    <rect x="0" y="0" width="110" height="40" rx="4" fill="#047857" stroke="#10b981" stroke-width="1.5" />
    <text x="55" y="24" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LM7805 (+5V)</text>

    <!-- 7812 -->
    <rect x="0" y="45" width="110" height="40" rx="4" fill="#0369a1" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="55" y="69" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LM7812 (+12V)</text>

    <!-- 7912 -->
    <rect x="0" y="90" width="110" height="40" rx="4" fill="#b91c1c" stroke="#f87171" stroke-width="1.5" />
    <text x="55" y="114" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">LM7912 (-12V)</text>
  </g>

  <!-- Output Wires -->
  <path d="M 700 130 L 735 130" stroke="#10b981" stroke-width="2" />
  <polygon points="735,130 729,126 729,134" fill="#10b981" />

  <path d="M 700 165 L 735 165" stroke="#0ea5e9" stroke-width="2" />
  <polygon points="735,165 729,161 729,169" fill="#0ea5e9" />

  <path d="M 700 210 L 735 210" stroke="#f87171" stroke-width="2" />
  <polygon points="735,210 729,206 729,214" fill="#f87171" />

  <!-- Measured Outputs -->
  <g transform="translate(735, 110)">
    <rect x="0" y="0" width="125" height="40" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="62" y="18" fill="#6ee7b7" font-size="10" text-anchor="middle">Measured Reading</text>
    <text x="62" y="32" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">4.98V - 5.02V</text>

    <rect x="0" y="45" width="125" height="40" rx="4" fill="#082f49" stroke="#0ea5e9" stroke-width="1" />
    <text x="62" y="63" fill="#7dd3fc" font-size="10" text-anchor="middle">Measured Reading</text>
    <text x="62" y="77" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">11.9V - 12.1V</text>

    <rect x="0" y="90" width="125" height="40" rx="4" fill="#450a0a" stroke="#f87171" stroke-width="1" />
    <text x="62" y="108" fill="#fca5a5" font-size="10" text-anchor="middle">Measured Reading</text>
    <text x="62" y="122" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">-11.8V to -12.0V</text>
  </g>

  <!-- Bottom Panel: Chemical Etching & Verification Workflow -->
  <g transform="translate(50, 270)">
    <rect width="810" height="165" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="20" y="25" fill="#f59e0b" font-size="13" font-weight="bold">Fabrication Workflow: Manual Ferric Chloride (FeCl3) Etching &amp; Status</text>
    
    <!-- Steps -->
    <g transform="translate(20, 45)">
      <rect width="135" height="95" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="67" y="25" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">1. Circuit Layout</text>
      <text x="67" y="45" fill="#94a3b8" font-size="9" text-anchor="middle">Track Design on</text>
      <text x="67" y="60" fill="#94a3b8" font-size="9" text-anchor="middle">Single-Sided Clad</text>
      <text x="67" y="80" fill="#64748b" font-size="9" text-anchor="middle">Resist Pen / Transfer</text>
    </g>

    <g transform="translate(180, 45)">
      <rect width="135" height="95" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="67" y="25" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">2. Chemical Etch</text>
      <text x="67" y="45" fill="#94a3b8" font-size="9" text-anchor="middle">FeCl3 Chemical Bath</text>
      <text x="67" y="60" fill="#94a3b8" font-size="9" text-anchor="middle">Removes Bare Copper</text>
      <text x="67" y="80" fill="#f59e0b" font-size="9" text-anchor="middle">Leaves Protected Tracks</text>
    </g>

    <g transform="translate(340, 45)">
      <rect width="135" height="95" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="67" y="25" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">3. Drill &amp; Assembly</text>
      <text x="67" y="45" fill="#94a3b8" font-size="9" text-anchor="middle">Hole Drilling for THT</text>
      <text x="67" y="60" fill="#94a3b8" font-size="9" text-anchor="middle">Hand Soldering ICs</text>
      <text x="67" y="80" fill="#64748b" font-size="9" text-anchor="middle">Heat Sinks Attached</text>
    </g>

    <g transform="translate(500, 45)">
      <rect width="135" height="95" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1" />
      <text x="67" y="25" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">4. Bench Testing</text>
      <text x="67" y="45" fill="#94a3b8" font-size="9" text-anchor="middle">DMM Verification</text>
      <text x="67" y="60" fill="#10b981" font-size="9" text-anchor="middle">Stable Outputs Recorded</text>
      <text x="67" y="80" fill="#64748b" font-size="9" text-anchor="middle">readings.txt Verified</text>
    </g>

    <g transform="translate(660, 45)">
      <rect width="130" height="95" rx="4" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
      <text x="65" y="25" fill="#fbbf24" font-size="11" font-weight="bold" text-anchor="middle">5. CAD Source Status</text>
      <text x="65" y="45" fill="#fde68a" font-size="9" text-anchor="middle">No .kicad_pcb / Gerbers</text>
      <text x="65" y="60" fill="#fde68a" font-size="9" text-anchor="middle">Bench Study Only</text>
      <text x="65" y="80" fill="#fca5a5" font-size="9" font-weight="bold" text-anchor="middle">Not Fab-Certified</text>
    </g>
  </g>
</svg>